services:
  - type: web
    name: mahjong-focus-api
    runtime: python
    rootDir: mahjong/backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: mahjong-focus-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mahjong-focus-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://mahjong-focus.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mahjong-focus.onrender.com
      - key: FRONTEND_URL
        value: https://mahjong-focus.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: mahjong-focus
    runtime: static
    rootDir: mahjong/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mahjong-focus-api.onrender.com/api

databases:
  - name: mahjong-focus-db
    plan: free
    databaseName: mahjong_focus
    user: mahjong_focus_user
